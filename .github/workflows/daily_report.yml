name: Daily Scheduling Report

on:
  schedule:
    # Runs every day at 07:00 UTC = 10:00 Israel time (UTC+3)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # Pinned to the versions the green runs use, so a surprise upstream
        # release can't break the report.
        run: pip install gspread==6.2.1 pandas==3.0.6 google-auth==2.58.0 requests==2.34.2

      - name: Run daily report
        env:
          GSHEETS_CREDENTIALS: ${{ secrets.GSHEETS_CREDENTIALS }}
        run: python daily_report.py
