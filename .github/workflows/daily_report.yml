name: Daily Scheduling Report

on:
  schedule:
    # Runs every day at 07:00 UTC = 10:00 Israel time (UTC+3)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread pandas google-auth

      - name: Run daily report
        env:
          GSHEETS_CREDENTIALS: ${{ secrets.GSHEETS_CREDENTIALS }}
        run: python daily_report.py
