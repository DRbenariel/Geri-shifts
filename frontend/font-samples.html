<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בחירת גופן — המערך הגריאטרי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- All candidate font pairings loaded for side-by-side comparison -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Fira+Code:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@300;400;500;600;700;800&family=Rubik:wght@300;400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-system/tokens.css" />
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      background: var(--bg); color: var(--text);
      background-image: radial-gradient(circle, #192438 1px, transparent 1px);
      background-size: 28px 28px;
      padding: var(--space-8);
      min-height: 100vh;
    }
    .page-title { font-family:'Heebo',sans-serif; font-weight:900; font-size:24px; color:var(--amber-hi); margin-bottom:6px; }
    .page-sub { font-family:'Heebo',sans-serif; font-weight:300; font-size:13px; color:var(--text-dim); margin-bottom:var(--space-8); }

    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--space-5); max-width:1100px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }

    /* Each sample inherits its own font via the .font-X class */
    .sample { border:1px solid var(--border); background:var(--bg-card); padding:0; overflow:hidden; }
    .sample-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 16px; border-bottom:1px solid var(--border-hi);
      background:var(--bg);
    }
    .sample-name { font-family:'Heebo',sans-serif; font-weight:700; font-size:13px; color:var(--text); letter-spacing:.04em; }
    .sample-tag { font-family:'Heebo',sans-serif; font-size:10px; color:var(--text-dim); }
    .sample-body { padding:var(--space-5); }

    /* ── the actual font under test applies to everything below ──────── */
    .ui { } /* set per-sample via inline font-family on .ui and .ui .num */
    .ui .title { font-weight:700; font-size:20px; color:var(--text); margin-bottom:4px; }
    .ui .label { font-weight:500; font-size:11px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .ui .kpi { font-size:48px; font-weight:700; line-height:1; color:var(--amber-hi); text-shadow:0 0 10px var(--amber-glow); direction:ltr; text-align:right; margin-bottom:2px; }
    .ui .kpi-sub { font-size:11px; font-weight:300; color:var(--text-dim); margin-bottom:18px; }

    .ui nav { display:flex; gap:18px; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:16px; }
    .ui nav span { font-size:13px; color:var(--text-dim); }
    .ui nav span.on { color:var(--amber-hi); font-weight:700; }

    .ui table { width:100%; border-collapse:collapse; font-size:13px; }
    .ui th { text-align:right; font-size:11px; font-weight:700; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border); }
    .ui td { text-align:right; padding:8px; border-bottom:1px solid var(--border); color:var(--text); }
    .ui .num { font-weight:700; color:var(--amber-hi); direction:ltr; display:inline-block; }
    .ui .row-date { color:var(--text); direction:ltr; }

    .ui .chips { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
    .ui .chip { display:flex; align-items:center; gap:5px; padding:4px 8px; font-size:11px; background:var(--bg); border-inline-start:2px solid var(--blue-hi); color:var(--text); }
    .ui .chip .cd { width:6px; height:6px; border-radius:50%; background:var(--blue-hi); }
    .ui .pangram { margin-top:16px; font-size:14px; color:var(--text); line-height:1.7; }
    .ui .pangram .en { color:var(--text-dim); font-size:12px; }
  </style>
</head>
<body>
  <div class="page-title">בחירת גופן למערכת</div>
  <div class="page-sub">אותו רכיב UI בארבע חלופות גופנים — השווה אותיות עבריות, ספרות, וכותרות. סמן את המועדף.</div>

  <div class="grid" id="grid"></div>

  <script>
    // [name, tag, uiFont, dataFont(for .num/.kpi/.row-date)]
    const FONTS = [
      ['נוכחי — Heebo + Fira Code', 'ברירת המחדל הקיימת', "'Heebo',sans-serif", "'Fira Code',monospace"],
      ['IBM Plex Sans Hebrew + Mono', 'טכני · מכשור · ספרות מונוספייס', "'IBM Plex Sans Hebrew',sans-serif", "'IBM Plex Mono',monospace"],
      ['Frank Ruhl Libre + Assistant', 'מערכת ראשי סריפי · גוף Assistant', "'Frank Ruhl Libre',serif", "'Assistant',sans-serif"],
      ['Rubik + Space Mono', 'גאומטרי חמים · ספרות Space Mono', "'Rubik',sans-serif", "'Space Mono',monospace"],
    ];

    const tpl = (uiFont, dataFont) => `
      <div class="ui" style="font-family:${uiFont}">
        <div class="label">סה״כ צוות</div>
        <div class="kpi" style="font-family:${dataFont}">14</div>
        <div class="kpi-sub">מתמחים ותורני חוץ · חודש יוני 2026</div>
        <nav>
          <span class="on">דוחות וניהול</span><span>סידור תורנויות</span><span>צוות</span><span>גאנט חודשי</span>
        </nav>
        <table>
          <thead><tr><th>שם</th><th>תפקיד</th><th>חסימות</th><th>טווח תאריכים</th></tr></thead>
          <tbody>
            <tr><td>ד״ר כהן</td><td>מתמחה</td><td><span class="num">7</span></td><td><span class="row-date">2026-06-22 → 2026-06-24</span></td></tr>
            <tr><td>לין חיר אל דין</td><td>מתמחה</td><td><span class="num">3</span></td><td><span class="row-date">2026-06-18</span></td></tr>
            <tr><td>סלאמה קאסם</td><td>תורן חוץ</td><td><span class="num">12</span></td><td><span class="row-date">2026-06-30</span></td></tr>
          </tbody>
        </table>
        <div class="chips">
          <span class="chip"><span class="cd"></span>פנימית גריאטרית</span>
          <span class="chip" style="border-inline-start-color:var(--amber-hi)"><span class="cd" style="background:var(--amber-hi)"></span>שיקום</span>
        </div>
        <div class="pangram">
          דג סקרן שט בים מאוכזב ולפתע מצא חברה<br>
          <span class="en">0123456789 · 06/2026 · 50% · ₪</span>
        </div>
      </div>`;

    document.getElementById('grid').innerHTML = FONTS.map(([name, tag, uf, df]) => `
      <div class="sample">
        <div class="sample-head">
          <span class="sample-name">${name}</span>
          <span class="sample-tag">${tag}</span>
        </div>
        <div class="sample-body">${tpl(uf, df)}</div>
      </div>`).join('');
  </script>
</body>
</html>
